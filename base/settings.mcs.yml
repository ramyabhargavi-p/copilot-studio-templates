displayName: <Agent Display Name>         # Must match displayName in agent.mcs.yml
schemaName: <agent_schema_name>           # Lowercase, underscores only — prefix for all component schemaNames (e.g. hr_assistant)
accessControlPolicy: ChatbotReaders       # Who can chat: ChatbotReaders | SpecificPeople | Anyone
authenticationMode: None                  # None | ManualAzureAD | IntegratedAzureAD (see base/README.md)

configuration:
  settings:
    GenerativeActionsEnabled: false       # true: AI auto-invokes actions; false: explicit topic triggers only

  recognizer:
    kind: GenerativeAIRecognizer          # Generative AI topic matching (recommended)

language: 1033                            # 1033 = English (US)

# template: <value>
# This field is added automatically by Copilot Studio when an agent is first created via a template
# (e.g. "kickStartTemplate-1.0.0" or "default-2.1.0"). It appears in settings.mcs.yml after cloning.
# Action: leave it as-is in your agent folder. Do not add it manually from this base file.
# Removing it is safe (no functional impact) but the extension may re-add it on the next Get Changes.
