# Name: Fallback
# Trigger: Fires when no topic matches the user's message (OnUnknownIntent)
# Purpose: Gracefully handle unmatched inputs — retry up to 3× then escalate to human.
#          High fallback rates indicate gaps in topic coverage, knowledge sources, or trigger phrases.
# NOTE: Replace all _REPLACE suffixes with unique random strings before use
# NOTE: Replace <AGENT_SCHEMA> with your agent's schemaName from settings.mcs.yml
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  priority: -1                            # Lowest priority — only fires if no other topic matches
  actions:
    # Log every fallback trigger — monitor FallbackCount trends to detect coverage gaps
    - kind: LogCustomTelemetryEvent
      id: logFallback_REPLACE1
      eventName: Agent.FallbackTriggered
      properties: >-
        ={
          UserQuery: System.Activity.Text,
          FallbackCount: System.FallbackCount,
          ConversationId: System.Conversation.Id,
          Channel: System.Activity.Channel,
          TimeUTC: Text(Now(), DateTimeFormat.UTC)
        }

    - kind: ConditionGroup
      id: conditionGroup_REPLACE2
      conditions:
        - id: conditionItem_REPLACE3
          condition: =System.FallbackCount < 3
          actions:
            - kind: SendActivity
              id: sendMessage_REPLACE4
              activity:
                text:
                  - I'm not sure I understand. Could you rephrase that?
                  - I didn't quite get that. Can you try asking in a different way?
                  - I'm having trouble understanding. Could you say that differently?

      elseActions:
        # 3 failed attempts — log the escalation reason and hand off to a human
        - kind: LogCustomTelemetryEvent
          id: logEscalation_REPLACE5
          eventName: Agent.EscalationTriggered
          properties: >-
            ={
              Reason: "FallbackExhausted",
              ConversationId: System.Conversation.Id,
              Channel: System.Activity.Channel,
              TimeUTC: Text(Now(), DateTimeFormat.UTC)
            }

        - kind: SendActivity
          id: sendMessage_REPLACE6
          activity:
            text:
              - I'm having trouble understanding your request. Let me connect you with someone who can help.

        - kind: BeginDialog
          id: beginDialog_REPLACE7
          dialog: <AGENT_SCHEMA>.topic.Escalate
