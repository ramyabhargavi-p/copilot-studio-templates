mcs.metadata:
  componentName: Out of Scope
  description: |-
    Trigger: Fires when the user asks about a topic clearly outside the agent's domain (OnRecognizedIntent)
    Purpose: Return a clear, helpful redirect instead of a confusing fallback message.
             Keeps Fallback counts clean — use this for KNOWN gaps, not unknown ones.
    Strategy:
      1. Add trigger phrases for known out-of-scope areas specific to this agent
      2. The agent instructions should ALSO tell the AI to detect and redirect out-of-scope queries
      3. This topic catches explicit signals; AI instructions handle the long tail
    NOTE: Replace all _REPLACE suffixes with unique random strings before use
    NOTE: Replace <DOMAIN>, <OUT-OF-SCOPE-TOPIC>, and <CONTACT> with your values
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Out of Scope
    triggerQueries:
      # Add phrases clearly outside YOUR agent's domain — be specific.
      # HR assistant examples:      "book a flight" | "IT support" | "office supplies"
      # IT helpdesk examples:       "payroll" | "HR policy" | "annual leave"
      # Customer support examples:  "investor relations" | "press enquiries"
      - <out-of-scope phrase 1>
      - <out-of-scope phrase 2>
      - <out-of-scope phrase 3>
      - <out-of-scope phrase 4>
      - <out-of-scope phrase 5>

  actions:
    # Log every out-of-scope trigger — high rates signal gaps in scope definition or trigger coverage
    - kind: LogCustomTelemetryEvent
      id: logOutOfScope_REPLACE1
      eventName: Agent.OutOfScope
      properties: >-
        ={
          UserQuery: System.Activity.Text,
          ConversationId: System.Conversation.Id,
          Channel: System.Activity.Channel,
          TimeUTC: Text(Now(), DateTimeFormat.UTC)
        }

    # Acknowledge the request, name the gap, and redirect to the right resource
    - kind: SendActivity
      id: sendMessage_REPLACE2
      activity:
        text:
          - That falls outside what I'm set up for. I specialise in <DOMAIN>. For <OUT-OF-SCOPE-TOPIC>, please reach out to <CONTACT>.
          - I'm only able to help with <DOMAIN>. For <OUT-OF-SCOPE-TOPIC>, <CONTACT> would be your best bet. Is there something about <DOMAIN> I can assist with?
