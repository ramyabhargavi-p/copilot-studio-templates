mcs.metadata:
  componentName: Greeting
  description: |-
    Trigger: Fires when the user greets the agent mid-conversation (OnRecognizedIntent)
    Purpose: Respond warmly to greetings without re-sending the full welcome message.
             Use ConversationStart.topic.mcs.yml for the initial conversation greeting.
    NOTE: Replace all _REPLACE suffixes with unique random strings before use
    WARNING: Do NOT change the trigger to OnConversationStart — that conflicts with the
             built-in Conversation Start system topic and causes a double greeting on load.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Greeting
    includeInOnSelectIntent: false
    triggerQueries:
      - Good afternoon
      - Good morning
      - Hello
      - Hey
      - Hi
      - Hi there
      - Hello again

  actions:
    - kind: SendActivity
      id: sendMessage_REPLACE1
      activity:
        text:
          - Hello! I'm {System.Bot.Name}. How can I help you today?
          - Hi there! What can I help you with?
          - Hello again! What would you like to know?

    - kind: CancelAllDialogs
      id: cancelAllDialogs_REPLACE2
