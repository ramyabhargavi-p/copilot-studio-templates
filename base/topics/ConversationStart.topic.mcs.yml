mcs.metadata:
  componentName: Conversation Start
  description: |-
    Trigger: Fires automatically when a new conversation begins (OnConversationStart)
    Purpose: Send the initial welcome message and log conversation start telemetry.
    NOTE: Only ONE topic per agent should use OnConversationStart.
          If the agent was cloned from Copilot Studio, a system Conversation Start topic
          already exists — update that one instead of adding this file.
    NOTE: Replace all _REPLACE suffixes with unique random strings before use
kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: SendActivity
      id: sendMessage_REPLACE1
      activity:
        text:
          - Hello! I'm {System.Bot.Name}. How can I help you today?
          - Hi there! Welcome to {System.Bot.Name}. What can I assist you with?
          - Greetings! I'm {System.Bot.Name} and I'm here to help. What would you like to know?
        speak:
          - Hello and thank you for contacting {System.Bot.Name}, powered by generative AI. How may I help you today?

    - kind: LogCustomTelemetryEvent
      id: logStart_REPLACE2
      eventName: Conversation.Started
      properties: "={BotName: System.Bot.Name, Channel: System.Activity.Channel, ConversationId: System.Conversation.Id, TimeUTC: Text(Now(), DateTimeFormat.UTC)}"
