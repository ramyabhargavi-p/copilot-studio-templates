# Name: UserDisplayName
# Purpose: Enables personalised greetings and responses without asking the user their name.
#          The M365 display name is loaded JIT at conversation start by the conversation-init topic.
#          Referenced in agent instructions as {Global.UserDisplayName}.
# Prerequisites:
#   - conversation-init topic must be included (loads this variable from M365 profile)
#   - Office 365 Users connector must be added to the agent
# NOTE: Replace <AGENT-SCHEMA-NAME> with your agent's schemaName (from settings.mcs.yml)
# NOTE: If Apply Changes fails with [0x800608ad:ExportKeyAttributeInvalidPrefix],
#       delete this file from your agent folder, push topics/settings first, then
#       re-add this file once the agent exists in the cloud. See troubleshooting/README.md.
kind: GlobalVariableComponent
schemaName: <AGENT-SCHEMA-NAME>.globalvariable.UserDisplayName
displayName: UserDisplayName
description: The user's display name from their M365 profile, loaded JIT at conversation start. Falls back to "there" if the field is blank in Azure AD.
variable:
  name: UserDisplayName
  aIVisibility: UseInAIContext
  scope: Conversation
  defaultValue: DEFAULT
