# Name: UserCountry
# The user's country from their M365 profile, loaded JIT at conversation start.
# Purpose: Enables country-aware responses without asking the user where they are.
#          Used by the orchestrator to select the correct country-specific policy, holiday, or procedure.
# Prerequisites:
#   - conversation-init topic must be included (loads this variable from M365 profile)
#   - Office 365 Users connector must be added to the agent
# NOTE: Replace <AGENT-SCHEMA-NAME> with your agent's schemaName prefix
name: UserCountry
aIVisibility: UseInAIContext                # Orchestrator needs country to route knowledge searches correctly
scope: Conversation
description: The user's country from their M365 profile, loaded JIT at conversation start. Falls back to "Unknown" if the field is blank in Azure AD.
schemaName: <AGENT-SCHEMA-NAME>.globalvariable.UserCountry
kind: GlobalVariableComponent
defaultValue: DEFAULT
