mcs.metadata:
  componentName: Knowledge Search
  description: |-
    Trigger: Fires when no topic matches the user's message (OnUnknownIntent)
    Purpose: Generate an answer from the agent's knowledge sources using generative AI.
             Includes telemetry for search invocation, answer found, and answer not found.
             If no answer is found, exits silently so the Fallback topic can handle it.
    Prerequisite: At least one knowledge source must be added to the agent
    NOTE: Replace all _REPLACE suffixes with unique random strings before use
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  priority: -1
  actions:
    - kind: LogCustomTelemetryEvent
      id: logSearchInvoked_REPLACE1
      eventName: Knowledge.SearchInvoked
      properties:

    # feedback-persisted hook — captures the user's question before generative answering starts.
    # System.Activity.Text is the user's message here; in OnGeneratedResponse it becomes the AI response.
    # Remove these two nodes if you are not using components/topics/feedback-persisted.
    - kind: SetVariable
      id: setFeedbackQuestion_REPLACE2
      variable: Global.FeedbackQuestion
      value: =System.Activity.Text

    - kind: SetVariable
      id: setFeedbackContext_REPLACE3
      variable: Global.FeedbackContext
      value: "Knowledge"