mcs.metadata:
  componentName: <Topic Name>
  description: |-
    Template: Topic that invokes a connector action with error handling and telemetry
    Use this instead of QuestionBranch when the topic's primary purpose is to call an action.
    Copy this template once per action-driven topic in your agent.
    NOTE: Replace all _REPLACE suffixes with unique random strings before use
    NOTE: Replace all <PLACEHOLDER> values with your content
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: <Topic Name>
    triggerQueries:
      - <trigger phrase 1>
      - <trigger phrase 2>
      - <trigger phrase 3>
      - <trigger phrase 4>
      - <trigger phrase 5>

  actions:
    - kind: LogCustomTelemetryEvent
      id: logTopicStarted_REPLACE1
      eventName: Topic.Started
      properties: >-
        ={
          TopicName: "<Topic Name>",
          UserQuery: System.Activity.Text,
          ConversationId: System.Conversation.Id,
          Channel: System.Activity.Channel,
          TimeUTC: Text(Now(), DateTimeFormat.UTC)
        }

    # Optional: collect input from the user before calling the action
    - kind: Question
      id: askInput_REPLACE2
      interruptionPolicy:
        allowInterruption: false
      alwaysPrompt: false
      variable: init:Topic.UserInput
      prompt: <Question to ask the user — or remove this node if no input is needed>
      entity: StringPrebuiltEntity

    - kind: InvokeConnectorAction
      id: callAction_REPLACE3
      output:
        kind: SingleVariableOutputBinding
        variable: init:Topic.ActionResult
      connectionReference: <connector_reference>        # e.g. shared_sharepointonline
      connectionProperties:
        mode: Invoker
      operationId: <OperationId>                        # e.g. GetItem
      parameters:
        <param1>: =Topic.UserInput                      # map connector inputs from topic variables

    # Branch on success vs. failure — check if result is populated
    - kind: ConditionGroup
      id: resultCheck_REPLACE4
      conditions:
        - id: successBranch_REPLACE5
          condition: =!IsBlank(Topic.ActionResult)
          actions:
            - kind: LogCustomTelemetryEvent
              id: logActionSucceeded_REPLACE6
              eventName: Action.Succeeded
              properties: >-
                ={
                  ActionName: "<ActionName>",   # Replace <ActionName> with your action name (e.g. GetLeaveBalance)
                  ConversationId: System.Conversation.Id,
                  Channel: System.Activity.Channel,
                  TimeUTC: Text(Now(), DateTimeFormat.UTC)
                }

            - kind: SendActivity
              id: sendResult_REPLACE7
              activity: <Message using the action result — e.g. "Your balance is {Topic.ActionResult.balance}">

            # CSAT wiring — show feedback prompt once per conversation
            - kind: ConditionGroup
              id: csatGuard_REPLACE8
              conditions:
                - id: csatCheck_REPLACE9
                  condition: =Not(Global.FeedbackShown)
                  actions:
                    - kind: SetVariable
                      id: markFeedback_REPLACE10
                      variable: Global.FeedbackShown
                      value: =true
                    - kind: BeginDialog
                      id: invokeFeedback_REPLACE11
                      dialog: <AGENT_SCHEMA>.topic.Feedback

      elseActions:
        - kind: LogCustomTelemetryEvent
          id: logActionFailed_REPLACE12
          eventName: Action.Failed
          properties: >-
            ={
              ActionName: "<ActionName>",   # Replace <ActionName> with your action name (e.g. GetLeaveBalance)
              ErrorCode: System.Error.Code,
              ConversationId: System.Conversation.Id,
              Channel: System.Activity.Channel,
              TimeUTC: Text(Now(), DateTimeFormat.UTC)
            }

        - kind: SendActivity
          id: sendErrorMessage_REPLACE13
          activity: <Apology message — e.g. "Sorry, I wasn't able to retrieve that information right now. Please try again shortly.">
