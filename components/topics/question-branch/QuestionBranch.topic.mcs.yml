# Name: <Topic Name>
# Trigger: Fires when user says something matching the trigger phrases (OnRecognizedIntent)
# Purpose: Ask the user a question and branch the conversation based on their answer.
#          Extend the ConditionGroup with as many branches as needed.
# NOTE: Replace all _REPLACE suffixes with unique random strings before use
# NOTE: Replace all <PLACEHOLDER> values with your content
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: <Topic Name>
    triggerQueries:
      - <trigger phrase 1>
      - <trigger phrase 2>
      - <trigger phrase 3>
      - <trigger phrase 4>
      - <trigger phrase 5>

  actions:
    # Optional: send an intro message before asking the question
    - kind: SendActivity
      id: sendMessage_REPLACE1
      activity:
        text:
          - <Intro message for this topic — or remove this node if not needed>

    # Ask the user a question and store their answer
    - kind: Question
      id: question_REPLACE2
      variable: init:Topic.UserChoice
      prompt: <Question prompt text>
      entity: StringPrebuiltEntity           # Change to: BooleanPrebuiltEntity | NumberPrebuiltEntity | DateTimePrebuiltEntity as needed
      alwaysPrompt: true
      interruptionPolicy:
        allowInterruption: false

    # Branch on the user's answer — add more conditions as needed
    - kind: ConditionGroup
      id: conditionGroup_REPLACE3
      conditions:
        - id: conditionItem_REPLACE4
          condition: =Topic.UserChoice = '<Option 1>'
          actions:
            - kind: SendActivity
              id: sendMessage_REPLACE5
              activity: <Response for Option 1>

        - id: conditionItem_REPLACE6
          condition: =Topic.UserChoice = '<Option 2>'
          actions:
            - kind: SendActivity
              id: sendMessage_REPLACE7
              activity: <Response for Option 2>

      elseActions:
        - kind: SendActivity
          id: sendMessage_REPLACE8
          activity: <Fallback response when no condition matches>
