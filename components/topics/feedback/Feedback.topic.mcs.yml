mcs.metadata:
  componentName: Feedback
  description: |-
    Trigger: OnRecognizedIntent (feedback phrases) or called via BeginDialog from any resolved topic
    Purpose: Collect CSAT — thumbs up/down → star rating (if negative) → optional free text category (if ≤3 stars).
             Logs all feedback to Application Insights. Guard with Global.FeedbackShown to fire once per conversation.
    PII note: feedbackText free-form input is collected in the card but NOT logged to telemetry.
              Only feedbackCategory (a dropdown value) and ratingScore are sent to Application Insights.
    Prerequisites: Global.FeedbackShown global variable must be declared
    NOTE: Replace all _REPLACE suffixes with unique random strings before use
    NOTE: Replace <SCHEMA> with your agent's schemaName from settings.mcs.yml
kind: AdaptiveDialog
modelDescription: Collects user CSAT feedback at the end of a conversation using a thumbs up/down → star rating → optional free text sequence. Logs all feedback to Application Insights.
id: <SCHEMA>_feedback_REPLACE1
name: Feedback
language: 1033

triggers:
  - kind: OnRecognizedIntent
    id: feedbackTrigger_REPLACE2
    intent:
      triggerQueries:
        - feedback
        - rate this
        - leave feedback
        - was this helpful
        - not helpful
        - thumbs up
        - thumbs down
        - rate the assistant
        - give feedback
        - how did I do
    actions:
      - kind: GotoAction
        id: gotoCollectFeedback_REPLACE3
        actionId: collectThumbsFeedback_REPLACE4

  # ── Thumbs up / down ──────────────────────────────────────────────────────
  - kind: OnActivity
    id: collectThumbsFeedback_REPLACE4
    activityType: message
    actions:
      - kind: SendActivity
        id: sendThumbsCard_REPLACE5
        activity:
          attachments:
            - contentType: application/vnd.microsoft.card.adaptive
              content:
                $schema: http://adaptivecards.io/schemas/adaptive-card.json
                type: AdaptiveCard
                version: "1.5"
                body:
                  - type: TextBlock
                    text: Was this helpful?
                    weight: Bolder
                    size: Medium
                    wrap: true
                  - type: TextBlock
                    text: Your feedback helps us improve this assistant.
                    size: Small
                    isSubtle: true
                    wrap: true
                actions:
                  - type: Action.Submit
                    title: "Yes, it helped"
                    style: positive
                    data:
                      feedbackType: thumbs
                      feedbackValue: positive
                      score: 1
                  - type: Action.Submit
                    title: "No, it didn't"
                    data:
                      feedbackType: thumbs
                      feedbackValue: negative
                      score: 0

      - kind: Question
        id: waitForThumbsResponse_REPLACE6
        variable: Topic.ThumbsResponse
        prompt: ""
        entityType: UserEntireResponse

      - kind: SetVariable
        id: setThumbsScore_REPLACE7
        variable: Topic.ThumbsScore
        value: =Topic.ThumbsResponse.score

      - kind: LogCustomTelemetryEvent
        id: logThumbsFeedback_REPLACE8
        eventName: Feedback.Thumbs
        properties: "={feedbackValue: Topic.ThumbsResponse.feedbackValue, score: Text(Topic.ThumbsScore), conversationId: System.Conversation.Id, channel: System.Activity.Channel, timeUTC: Text(Now(), DateTimeFormat.UTC)}"

      # ── If positive: thank and close ──────────────────────────────────────
      - kind: ConditionGroup
        id: checkThumbsResult_REPLACE9
        conditions:
          - id: positiveThumbsBranch_REPLACE10
            condition: =Topic.ThumbsResponse.feedbackValue = "positive"
            actions:
              - kind: SendActivity
                id: sendPositiveThanks_REPLACE11
                activity:
                  text: Thank you for the positive feedback — glad I could help!
              - kind: EndDialog
                id: endOnPositive_REPLACE12

          # ── If negative: ask for star rating ──────────────────────────────
          - id: negativeThumbsBranch_REPLACE13
            condition: =Topic.ThumbsResponse.feedbackValue = "negative"
            actions:
              - kind: SendActivity
                id: sendRatingCard_REPLACE14
                activity:
                  attachments:
                    - contentType: application/vnd.microsoft.card.adaptive
                      content:
                        $schema: http://adaptivecards.io/schemas/adaptive-card.json
                        type: AdaptiveCard
                        version: "1.5"
                        body:
                          - type: TextBlock
                            text: How would you rate this conversation?
                            weight: Bolder
                            size: Medium
                            wrap: true
                          - type: TextBlock
                            text: "1 = Very poor  ·  5 = Excellent"
                            size: Small
                            isSubtle: true
                        actions:
                          - type: Action.Submit
                            title: "1 - Very poor"
                            data:
                              feedbackType: rating
                              feedbackValue: "1"
                              score: 1
                          - type: Action.Submit
                            title: "2 - Poor"
                            data:
                              feedbackType: rating
                              feedbackValue: "2"
                              score: 2
                          - type: Action.Submit
                            title: "3 - Average"
                            data:
                              feedbackType: rating
                              feedbackValue: "3"
                              score: 3
                          - type: Action.Submit
                            title: "4 - Good"
                            data:
                              feedbackType: rating
                              feedbackValue: "4"
                              score: 4
                          - type: Action.Submit
                            title: "5 - Excellent"
                            style: positive
                            data:
                              feedbackType: rating
                              feedbackValue: "5"
                              score: 5

              - kind: Question
                id: waitForRating_REPLACE15
                variable: Topic.RatingResponse
                prompt: ""
                entityType: UserEntireResponse

              - kind: SetVariable
                id: setRatingScore_REPLACE16
                variable: Topic.RatingScore
                value: =Topic.RatingResponse.score

              - kind: LogCustomTelemetryEvent
                id: logRatingFeedback_REPLACE17
                eventName: Feedback.Rating
                properties: "={score: Text(Topic.RatingScore), conversationId: System.Conversation.Id, channel: System.Activity.Channel, timeUTC: Text(Now(), DateTimeFormat.UTC)}"

              # ── If rating ≤ 3: ask for improvement category ────────────────
              - kind: ConditionGroup
                id: checkRatingScore_REPLACE18
                conditions:
                  - id: lowRatingBranch_REPLACE19
                    condition: =Topic.RatingScore <= 3
                    actions:
                      - kind: SendActivity
                        id: sendTextCard_REPLACE20
                        activity:
                          attachments:
                            - contentType: application/vnd.microsoft.card.adaptive
                              content:
                                $schema: http://adaptivecards.io/schemas/adaptive-card.json
                                type: AdaptiveCard
                                version: "1.5"
                                body:
                                  - type: TextBlock
                                    text: What could we improve?
                                    weight: Bolder
                                    size: Medium
                                    wrap: true
                                  - type: TextBlock
                                    text: Optional — your comments help us make this assistant better.
                                    size: Small
                                    isSubtle: true
                                    wrap: true
                                  - type: Input.ChoiceSet
                                    id: feedbackCategory
                                    label: What best describes the issue?
                                    style: compact
                                    choices:
                                      - title: Answer was wrong or inaccurate
                                        value: wrong_answer
                                      - title: Answer was incomplete
                                        value: incomplete
                                      - title: Couldn't understand my question
                                        value: not_understood
                                      - title: Topic not covered
                                        value: out_of_scope
                                      - title: Took too long / too many steps
                                        value: too_slow
                                      - title: Other
                                        value: other
                                  # feedbackText (free-form) removed — PII risk.
                                  # Category dropdown captures actionable signal without personal data.
                                actions:
                                  - type: Action.Submit
                                    title: Submit feedback
                                    style: positive
                                    data:
                                      feedbackType: text
                                  - type: Action.Submit
                                    title: Skip
                                    data:
                                      feedbackType: text
                                      skipped: true

                      - kind: Question
                        id: waitForTextResponse_REPLACE21
                        variable: Topic.TextResponse
                        prompt: ""
                        entityType: UserEntireResponse

                      - kind: ConditionGroup
                        id: checkIfSkipped_REPLACE22
                        conditions:
                          - id: notSkippedBranch_REPLACE23
                            condition: =!Topic.TextResponse.skipped
                            actions:
                              - kind: LogCustomTelemetryEvent
                                id: logCategoryFeedback_REPLACE24
                                eventName: Feedback.Category
                                properties: "={feedbackCategory: Topic.TextResponse.feedbackCategory, ratingScore: Text(Topic.RatingScore), conversationId: System.Conversation.Id, channel: System.Activity.Channel, timeUTC: Text(Now(), DateTimeFormat.UTC)}"

                  - id: highRatingBranch_REPLACE25
                    condition: =Topic.RatingScore > 3
                    actions: []

              - kind: SendActivity
                id: sendFinalThanks_REPLACE26
                activity:
                  text: Thank you for your feedback — it helps us improve. If you need anything else, I'm here to help.

      - kind: EndDialog
        id: endFeedback_REPLACE27
