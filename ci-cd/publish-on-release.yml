name: Push and Publish Agent to Production on Release

on:
  release:
    types:
      - published

env:
  AGENT_PATH: agents/${{ vars.AGENT_SCHEMA_NAME }}   # set AGENT_SCHEMA_NAME in repo variables

jobs:
  deploy-to-production:
    name: Push and publish to production environment
    runs-on: ubuntu-latest
    environment: production   # requires manual approval if you configure a protection rule

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check for unreplaced placeholders
        run: |
          echo "Checking for unreplaced <PLACEHOLDER> values..."
          if grep -r "<[A-Z_]*>" "${{ env.AGENT_PATH }}" --include="*.yml" -l; then
            echo "ERROR: Found unreplaced placeholders. Aborting production deploy."
            exit 1
          fi
          if grep -r "_REPLACE" "${{ env.AGENT_PATH }}" --include="*.yml" -l; then
            echo "ERROR: Found _REPLACE node IDs. Aborting production deploy."
            exit 1
          fi
          echo "Placeholder check passed."

      - name: Install Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Authenticate to Power Platform
        run: |
          pac auth create \
            --applicationId "${{ secrets.POWER_PLATFORM_CLIENT_ID }}" \
            --clientSecret "${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}" \
            --tenant "${{ secrets.POWER_PLATFORM_TENANT_ID }}" \
            --environment "${{ secrets.POWER_PLATFORM_PROD_URL }}"

      - name: Push agent to production environment
        working-directory: ${{ env.AGENT_PATH }}
        run: |
          pac copilot push \
            --environment "${{ secrets.POWER_PLATFORM_PROD_URL }}"

      - name: Publish agent
        run: |
          pac copilot publish \
            --environment "${{ secrets.POWER_PLATFORM_PROD_URL }}" \
            --schemaName "${{ vars.AGENT_SCHEMA_NAME }}"

      - name: Deployment summary
        if: success()
        run: |
          echo "### Agent deployed to production ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ secrets.POWER_PLATFORM_PROD_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release tag:** ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Released by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify the published version in Copilot Studio test canvas" >> $GITHUB_STEP_SUMMARY
          echo "2. Check Application Insights for errors in the first 15 minutes" >> $GITHUB_STEP_SUMMARY
          echo "3. Run the post-publish smoke test (see launch/launch-checklist.md)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "### ❌ Production deployment FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review the logs above. The production environment has NOT been updated." >> $GITHUB_STEP_SUMMARY
          echo "See operations/runbook.md for recovery procedures." >> $GITHUB_STEP_SUMMARY
