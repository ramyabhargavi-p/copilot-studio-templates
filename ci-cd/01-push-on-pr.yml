name: Push Agent to Dev on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'agents/**'

env:
  AGENT_PATH: agents/${{ vars.AGENT_SCHEMA_NAME }}   # set AGENT_SCHEMA_NAME in repo variables

jobs:
  validate-and-push:
    name: Validate YAML and push to dev environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for unreplaced placeholders
        run: |
          echo "Checking for unreplaced <PLACEHOLDER> values..."
          if grep -r "<[A-Z_]*>" "${{ env.AGENT_PATH }}" --include="*.yml" -l; then
            echo "ERROR: Found unreplaced placeholders in agent YAML files."
            echo "Replace all <PLACEHOLDER> values before merging."
            exit 1
          fi
          echo "Checking for unreplaced _REPLACE node IDs..."
          if grep -r "_REPLACE" "${{ env.AGENT_PATH }}" --include="*.yml" -l; then
            echo "ERROR: Found _REPLACE node IDs in agent YAML files."
            echo "Replace all _REPLACE suffixes with unique 6-character strings."
            exit 1
          fi
          echo "Placeholder check passed."

      - name: Install Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Authenticate to Power Platform
        run: |
          pac auth create \
            --applicationId "${{ secrets.POWER_PLATFORM_CLIENT_ID }}" \
            --clientSecret "${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}" \
            --tenant "${{ secrets.POWER_PLATFORM_TENANT_ID }}" \
            --environment "${{ secrets.POWER_PLATFORM_DEV_URL }}"

      - name: Push agent to dev (configure before use — see ci-cd/README.md)
        working-directory: ${{ env.AGENT_PATH }}
        run: |
          # pac copilot push does not exist in the pac CLI.
          # Replace this step with your deployment approach:
          #   Option A: VS Code "Copilot Studio: Apply Changes" (manual only, not automatable in CI)
          #   Option B: Solution-based ALM — see ci-cd/04-solution-build-and-deploy.yml
          echo "ERROR: This step is a placeholder. pac copilot push is not a valid pac CLI command."
          echo "Configure your deployment approach before running this pipeline. See ci-cd/README.md."
          exit 1

      - name: Push summary
        if: success()
        run: |
          echo "### Agent pushed to dev environment ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ secrets.POWER_PLATFORM_DEV_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Agent path:** ${{ env.AGENT_PATH }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The agent is now available in the test canvas. Publish manually in Copilot Studio to make it live in the dev channel." >> $GITHUB_STEP_SUMMARY
