name: Promote Agent — UAT to Production

# Triggers when a GitHub Release is published (tag format: v1.x.x).
# Requires manual approval via the 'production' GitHub Environment protection rule.
# Pushes to production and publishes the agent — making it live for end users.

on:
  release:
    types:
      - published

env:
  AGENT_PATH: agents/${{ vars.AGENT_SCHEMA_NAME }}

jobs:
  # Job 1: Pre-flight checks before requesting approval
  pre-flight:
    name: Pre-flight validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate — no unreplaced placeholders
        run: |
          PLACEHOLDERS=$(grep -r "<[A-Z_]*>" "${{ env.AGENT_PATH }}" --include="*.yml" -l 2>/dev/null || true)
          if [ -n "$PLACEHOLDERS" ]; then
            echo "ERROR: Unreplaced placeholders found. Aborting."
            exit 1
          fi

          REPLACE_IDS=$(grep -r "_REPLACE" "${{ env.AGENT_PATH }}" --include="*.yml" -l 2>/dev/null || true)
          if [ -n "$REPLACE_IDS" ]; then
            echo "ERROR: _REPLACE node IDs found. Aborting."
            exit 1
          fi
          echo "Pre-flight validation passed."

      - name: Confirm release tag format
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Release tag '$TAG' does not match expected format vMAJOR.MINOR.PATCH"
            echo "Use semantic versioning: e.g. v1.0.0, v1.2.3"
            exit 1
          fi
          echo "Tag format valid: $TAG"

      - name: Pre-flight summary
        run: |
          echo "### Pre-flight checks passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release notes:** ${{ github.event.release.body }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Awaiting manual approval for production deployment..." >> $GITHUB_STEP_SUMMARY

  # Job 2: Production deployment — requires manual approval via 'production' environment
  deploy-to-production:
    name: Deploy and publish to production
    runs-on: ubuntu-latest
    needs: pre-flight
    environment: production    # ← configure required reviewers in GitHub Settings → Environments → production

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Authenticate to Power Platform (Production)
        run: |
          pac auth create \
            --applicationId "${{ secrets.POWER_PLATFORM_CLIENT_ID }}" \
            --clientSecret "${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}" \
            --tenant "${{ secrets.POWER_PLATFORM_TENANT_ID }}" \
            --environment "${{ secrets.POWER_PLATFORM_PROD_URL }}"

      - name: Push agent to production
        working-directory: ${{ env.AGENT_PATH }}
        run: |
          pac copilot push \
            --environment "${{ secrets.POWER_PLATFORM_PROD_URL }}"

      - name: Publish agent to production
        run: |
          pac copilot publish \
            --environment "${{ secrets.POWER_PLATFORM_PROD_URL }}" \
            --schemaName "${{ vars.AGENT_SCHEMA_NAME }}"

      - name: Record deployment
        run: |
          echo "### Production deployment complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ github.event.release.tag_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Post-deployment checklist:**" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Verify published version in Copilot Studio test canvas" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Check Application Insights for errors (first 15 minutes)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Run post-publish smoke test (see \`launch/launch-checklist.md\`)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Send user communication if this is a first release or breaking change" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "### ❌ PRODUCTION DEPLOYMENT FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**The production environment has NOT been updated.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Immediate actions:" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the logs above to identify the failure point" >> $GITHUB_STEP_SUMMARY
          echo "2. Check Power Platform service health: https://admin.powerplatform.microsoft.com/servicestatus" >> $GITHUB_STEP_SUMMARY
          echo "3. If push succeeded but publish failed: publish manually in Copilot Studio UI" >> $GITHUB_STEP_SUMMARY
          echo "4. See \`operations/runbook.md\` for recovery procedures" >> $GITHUB_STEP_SUMMARY
